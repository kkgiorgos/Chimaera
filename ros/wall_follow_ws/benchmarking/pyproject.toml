[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wall-follow-analysis"
version = "0.2.0"
description = "Standalone wall-follow experiment analysis; no ROS Python dependencies"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.scripts]
wall-follow-plot = "wall_follow_benchmark.plot:main"

[tool.setuptools.packages.find]
where = ["."]
