[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wall-follow-analysis"
version = "0.3.0"
description = "Standalone wall-follow experiment analysis; no ROS Python dependencies"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["wall_follow_benchmark", "wall_follow_sim"]

[tool.setuptools.package-dir]
wall_follow_sim = "../src/wall_follow_robot/wall_follow_sim"
